name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check generated code is up to date
        shell: bash
        run: |
          go generate ./arabic/...
          if [[ -n "$(git status --porcelain arabic/tables.go)" ]]; then
            echo "arabic/tables.go is out of date with arabic/gen/main.go or arabic/gen/UnicodeData.txt:"
            git diff arabic/tables.go
            exit 1
          fi

      - name: Static analysis (staticcheck)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  fuzz:
    name: Fuzz (regression corpus + short run)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Each -fuzz run first replays the checked-in corpus under testdata/fuzz
      # (so a past crasher never regresses silently), then spends the rest of
      # fuzztime exploring new inputs.
      - name: Fuzz normalize idempotence
        run: go test -run '^$' -fuzz '^FuzzNormalizeIdempotent$' -fuzztime 20s ./arabic

      - name: Fuzz normalize UTF-8 validity
        run: go test -run '^$' -fuzz '^FuzzNormalizeValidUTF8$' -fuzztime 20s ./arabic

      - name: Fuzz normalize no panic
        run: go test -run '^$' -fuzz '^FuzzNormalizeNoPanic$' -fuzztime 20s ./arabic

      # These three fuzz across the *entire* Profile flag space (every bool
      # combination x every TashkilScope value), not just the five named
      # presets. FuzzProfileNormalizeIdempotent in particular is what found
      # every hamza/canonical-ordering interaction bug during development —
      # see the Normalize doc comment in arabic/profile.go — so it gets the
      # longest budget here.
      - name: Fuzz profile normalize idempotence (full flag space)
        run: go test -run '^$' -fuzz '^FuzzProfileNormalizeIdempotent$' -fuzztime 45s ./arabic

      - name: Fuzz profile normalize UTF-8 validity (full flag space)
        run: go test -run '^$' -fuzz '^FuzzProfileNormalizeValidUTF8$' -fuzztime 20s ./arabic

      - name: Fuzz profile normalize no panic (full flag space, incl. invalid scopes)
        run: go test -run '^$' -fuzz '^FuzzProfileNormalizeNoPanic$' -fuzztime 20s ./arabic

      - name: Fuzz literal matcher no panic
        run: go test -run '^$' -fuzz '^FuzzNewLiteralNoPanic$' -fuzztime 20s ./match

      - name: Fuzz search no panic
        run: go test -run '^$' -fuzz '^FuzzSearchNoPanic$' -fuzztime 20s ./scan

  release-check:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build snapshot with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean
