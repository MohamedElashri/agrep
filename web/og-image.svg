<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e464a"/>
      <stop offset="100%" stop-color="#17383b"/>
    </linearGradient>
  </defs>

  <!-- Background: Deep Pine -->
  <rect width="1200" height="630" fill="#17383b"/>

  <!-- Subtle inner border -->
  <rect x="28" y="28" width="1144" height="574" rx="16" fill="none" stroke="#2a5255" stroke-width="2"/>

  <!-- Brand Mark -->
  <g transform="translate(84, 80)">
    <rect width="64" height="64" rx="12" fill="#204b4f" stroke="#366b6f" stroke-width="1.5"/>
    <text x="32" y="44" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', Georgia, serif" font-weight="bold" font-size="40" fill="#b7e5cc">ا</text>
    <text x="86" y="46" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="44" fill="#ffffff" letter-spacing="-0.03em">agrep<tspan fill="#cb6a34">.</tspan></text>
  </g>

  <!-- Tagline Kicker -->
  <text x="84" y="200" font-family="ui-monospace, monospace" font-weight="700" font-size="16" fill="#cb6a34" letter-spacing="0.12em">
    UNICODE-AWARE SEARCH ENGINE
  </text>

  <!-- Headline: Editorial Serif -->
  <text x="84" y="275" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-size="54" fill="#ffffff" letter-spacing="-0.025em">
    Ultrafast, Unicode-aware search
  </text>
  <text x="84" y="345" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-size="54" fill="#b7e5cc" letter-spacing="-0.025em">
    for Arabic-script text.
  </text>

  <!-- Subtitle -->
  <text x="84" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#c5dcd1">
    Zero-allocation diacritic folding · Dotless rasm · Myers fuzzy search · Exact source byte spans
  </text>

  <!-- Feature Tags -->
  <g transform="translate(84, 480)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="190" height="46" rx="8" fill="#1b4144" stroke="#2d5e62" stroke-width="1.2"/>
    <text x="95" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#e2efe8">6 Language Scripts</text>

    <!-- Tag 2 -->
    <rect x="206" y="0" width="180" height="46" rx="8" fill="#1b4144" stroke="#2d5e62" stroke-width="1.2"/>
    <text x="296" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#e2efe8">Streaming CLI</text>

    <!-- Tag 3 -->
    <rect x="402" y="0" width="220" height="46" rx="8" fill="#1b4144" stroke="#2d5e62" stroke-width="1.2"/>
    <text x="512" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#e2efe8">WebAssembly Demo</text>

    <!-- Tag 4 -->
    <rect x="638" y="0" width="200" height="46" rx="8" fill="#1b4144" stroke="#2d5e62" stroke-width="1.2"/>
    <text x="738" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#e2efe8">Modular Go Library</text>
  </g>

  <!-- URL -->
  <text x="1116" y="510" text-anchor="end" font-family="ui-monospace, monospace" font-weight="600" font-size="18" fill="#8cb9a7">
    mohamedelashri.github.io/agrep
  </text>
</svg>
