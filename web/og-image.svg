<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="96" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="bold" font-size="64" fill="#1c1c1c">agrep</text>
  <text x="96" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#1c1c1c">Search Arabic-script text across diacritics,</text>
  <text x="96" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#1c1c1c">spelling variants, and ligatures.</text>
  <rect x="96" y="380" width="1008" height="150" rx="6" fill="#f6f6f4" stroke="#e3e3df" stroke-width="2"/>
  <text x="128" y="438" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" fill="#1c1c1c"><tspan fill="#7d7d7d">$ </tspan>agrep 'مدرسه' corpus.txt</text>
  <text x="1072" y="497" text-anchor="end" font-family="'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', serif" font-size="36" fill="#1c1c1c" direction="rtl">هذه مَدْرَسَةٌ عريقة في المدينة.</text>
</svg>
