<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#36b890" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#18383a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c1a1b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18383a"/>
      <stop offset="100%" stop-color="#122527"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36b890"/>
      <stop offset="100%" stop-color="#7ee0be"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0c1a1b"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#234346" stroke-width="2"/>

  <!-- Brand Mark -->
  <g transform="translate(80, 80)">
    <rect width="72" height="72" rx="16" fill="url(#card-grad)" stroke="#36b890" stroke-width="2" stroke-opacity="0.5"/>
    <text x="36" y="50" text-anchor="middle" font-family="Amiri, Georgia, serif" font-weight="bold" font-size="46" fill="#36b890">ا</text>
    <text x="96" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="48" fill="#f0f6f4" letter-spacing="-0.04em">agrep<tspan fill="#36b890">.</tspan></text>
  </g>

  <!-- Version Pill -->
  <g transform="translate(930, 92)">
    <rect width="190" height="44" rx="22" fill="#122527" stroke="#335d62" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="5" fill="#36b890"/>
    <text x="38" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#95b3ab">v0.1.1 RELEASED</text>
  </g>

  <!-- Headline -->
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="850" font-size="56" fill="#f0f6f4" letter-spacing="-0.035em">
    Ultrafast, Unicode-aware search
  </text>
  <text x="80" y="330" font-family="system-ui, -apple-system, sans-serif" font-weight="850" font-size="56" fill="url(#text-grad)" letter-spacing="-0.035em">
    for Arabic-script corpora.
  </text>

  <!-- Subtitle -->
  <text x="80" y="405" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#95b3ab">
    Diacritic folding · Dotless rasm · Myers fuzzy search · Exact byte span mapping
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="50" rx="12" fill="#122527" stroke="#234346" stroke-width="1.5"/>
    <text x="90" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#f0f6f4">6 Languages</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="230" height="50" rx="12" fill="#122527" stroke="#234346" stroke-width="1.5"/>
    <text x="315" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#f0f6f4">1,214 MiB/s Speed</text>

    <!-- Pill 3 -->
    <rect x="450" y="0" width="220" height="50" rx="12" fill="#122527" stroke="#234346" stroke-width="1.5"/>
    <text x="560" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#f0f6f4">WebAssembly Live</text>

    <!-- Pill 4 -->
    <rect x="690" y="0" width="210" height="50" rx="12" fill="#122527" stroke="#234346" stroke-width="1.5"/>
    <text x="795" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#f0f6f4">Modular Go API</text>
  </g>

  <!-- Footer Link -->
  <text x="1120" y="512" text-anchor="end" font-family="ui-monospace, monospace" font-weight="600" font-size="18" fill="#62827a">
    mohamedelashri.github.io/agrep
  </text>
</svg>
